# Islet（灵岛）发布说明配置（供发布流程读取，复制到 GitHub Release 表单）
# 规则：标题必须且只能是完整版本标签；正文以发布日期开始，列出不超过 5 条带 emoji 的变更。
v0.1.0-beta1:
  title: v0.1.0-beta1
  date: 2026-11-24
  prerelease: true
  tag: v0.1.0-beta1
  body: |
    发布日期：2026-11-24

    - ✨️ 扩展灵动岛信息面板，加入时间进度、倒数日、汇率、系统监控、网速、磁盘、快速启动、中转站、下班倒计时、系统信息与护眼提醒
    - ✨️ 支持面板排列与启用状态设置，并优化面板信息密度与展开交互
    - 🐛 修复热更新后面板选择恢复为默认首页的问题
    - 🎨 更新 Islet（灵岛）应用图标，并用于桌面程序、托盘、关于页面和文档站
    - 📦️ 增加静态版本清单供应用检查更新，不依赖 GitHub Releases API

    > 测试版，请先备份重要文档；遇到问题请通过 Issues 反馈。

v0.2.0:
  title: v0.2.0
  date: 2026-11-21
  prerelease: false
  tag: v0.2.0
  body: |
    发布日期：2026-11-21

    - ✨️ 多面板系统：日历、天气、音乐、番茄专注、剪贴板历史、喝水/上厕所六个面板，翻页箭头与指示点切换
    - ✨️ 天气接入 Open-Meteo 真实数据；音乐通过 SMTC 读取本机播放器并支持播放控制
    - ✨️ 灵动岛支持拖动换位与四边停靠，位置跨启动记忆
    - ✨️ 新增设置窗口：外观、数据、关于
    - 📦️ 剪贴板监听、系统媒体控制与本地偏好持久化

v0.1.0:
  title: v0.1.0
  date: 2026-11-21
  prerelease: false
  tag: v0.1.0
  body: |
    发布日期：2026-11-21

    - ✨️ Windows 桌面灵动岛：顶部居中、透明置顶、无边框悬浮窗，收起态为胶囊样式
    - ✨️ 展开面板展示当前日期、时间、当月日历与天气示例卡片
    - ✨️ 悬停展开、移出收起交互，并提供系统托盘与设置菜单退出入口
    - 📦️ Tauri 2 + Vue 3 + shadcn-vue 工程搭建，附 VitePress 产品文档站
