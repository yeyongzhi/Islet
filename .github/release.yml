# Islet（灵岛）发布说明配置（供发布流程读取，复制到 GitHub Release 表单）
# 规则：标题必须且只能是完整版本标签；正文以发布日期开始，列出不超过 5 条带 emoji 的变更。
v0.1.0-beta3:
  title: v0.1.0-beta3
  date: 2026-11-25
  prerelease: true
  tag: v0.1.0-beta3
  body: |
    发布日期：2026-11-25

    - ✨️ 收起态新增日期、星期和电量，支持水平调整内容位置及侧边显示
    - ✨️ 新增大写锁定、数字键盘和音乐播放状态通知，并按用途分组
    - 🎨 相册改为三列滚动，支持打开图片及所在文件夹；喝水面板新增水位动画
    - 🎨 优化天气刷新、快速启动图标、显示器名称和面板快捷切换
    - 🐛 调整透明窗口收起时的尺寸与位置更新，改善下拉菜单移出处理

    > 测试版，请先备份重要文档；遇到问题请通过 Issues 反馈。

v0.1.0-beta2:
  title: v0.1.0-beta2
  date: 2026-11-24
  prerelease: true
  tag: v0.1.0-beta2
  body: |
    发布日期：2026-11-24

    - ✨️ 新增本机相册，支持选择图片、设置每行数量及自动或手动切换
    - ✨️ 完善快速启动，提供常用 Windows 系统入口并支持添加和编辑本地路径与链接
    - 🎨 支持自定义收起态内容与顺序、切换展开动画和提醒摇晃，更新圆角应用图标
    - 🎨 优化剪贴板、下班倒计时、通知卡片、喝水目标和面板设置预览与排序
    - 🧪 按需加载面板并在收起后释放，改善资源使用，同时完善产品文档

    > 测试版，请先备份重要文档；遇到问题请通过 Issues 反馈。

v0.1.0-beta1:
  title: v0.1.0-beta1
  date: 2026-11-24
  prerelease: true
  tag: v0.1.0-beta1
  body: |
    发布日期：2026-11-24

    - ✨️ 扩展灵动岛信息面板，加入时间进度、倒数日、汇率、系统监控、网速、磁盘、快速启动、中转站、下班倒计时、系统信息与护眼提醒
    - ✨️ 支持面板排列与启用状态设置、更多外观和通用选项，并优化面板信息密度与展开交互
    - 🐛 修复热更新后面板选择恢复为默认首页的问题
    - 🎨 更新 Islet（灵岛）应用图标，并用于桌面程序、托盘、关于页面和文档站
    - 📦️ 增加静态版本清单供应用检查更新，不依赖 GitHub Releases API

    > 测试版，请先备份重要文档；遇到问题请通过 Issues 反馈。
