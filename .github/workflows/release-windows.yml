name: Build and Publish Windows Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to build and publish (for example v0.1.0-beta1)
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Resolve release tag
        id: release
        shell: pwsh
        env:
          INPUT_TAG: ${{ inputs.tag }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          $tag = if ($env:INPUT_TAG) { $env:INPUT_TAG.Trim() } else { $env:REF_NAME }
          if ($tag -notmatch '^v\d+\.\d+\.\d+(-[0-9A-Za-z.-]+)?$') {
            throw "Invalid release tag: $tag"
          }
          "tag=$tag" >> $env:GITHUB_OUTPUT

      - name: Checkout release source
        uses: actions/checkout@v7
        with:
          ref: ${{ steps.release.outputs.tag }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 12.10.1
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Windows NSIS installer
        run: pnpm tauri build --bundles nsis

      - name: Inspect installer before upload
        shell: pwsh
        run: |
          $installers = @(Get-ChildItem src-tauri/target/release/bundle/nsis/*-setup.exe)
          if ($installers.Count -ne 1) { throw "Expected one installer, found $($installers.Count)" }
          $destination = Join-Path $env:RUNNER_TEMP 'islet-installer-inspection'
          7z x -y "-o$destination" $installers[0].FullName | Out-Null
          if ($LASTEXITCODE -ne 0) { throw 'Installer extraction failed' }
          $files = @(Get-ChildItem -LiteralPath $destination -Recurse -File)
          if (-not ($files | Where-Object { $_.Name -eq 'islet.exe' })) { throw 'Application executable is missing' }
          $forbidden = @($files | Where-Object { $_.Name -match '^(\.env(?:\..*)?|.*\.(?:pem|key|pfx|p12|log))$' -or $_.FullName -match '[\\/](?:node_modules|\.git|__pycache__)[\\/]' })
          if ($forbidden.Count) { $forbidden | ForEach-Object { Write-Error "Unexpected file: $($_.FullName)" }; throw 'Installer content check failed' }
          $files | ForEach-Object { Write-Output $_.FullName }
          Get-FileHash -Algorithm SHA256 $installers[0].FullName

      - name: Prepare release notes
        shell: pwsh
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          $tagPattern = [regex]::Escape($env:RELEASE_TAG)
          $changelog = Get-Content CHANGELOG.md -Raw
          $pattern = "(?ms)^## $tagPattern[^\r\n]*\r?\n(.*?)(?=^## |\z)"
          $match = [regex]::Match($changelog, $pattern)
          if (-not $match.Success) { throw "No CHANGELOG.md entry found for $env:RELEASE_TAG" }
          $config = Get-Content .github/release.yml -Raw
          $sectionPattern = "(?ms)^$tagPattern`:\s*\r?\n(.*?)(?=^v\d|\z)"
          $section = [regex]::Match($config, $sectionPattern)
          if (-not $section.Success) { throw "No release.yml entry found for $env:RELEASE_TAG" }
          $bodyMatch = [regex]::Match($section.Groups[1].Value, '(?ms)^  body: \|\s*\r?\n(.*)')
          if (-not $bodyMatch.Success) { throw "No release body for $env:RELEASE_TAG" }
          $body = (($bodyMatch.Groups[1].Value -split "`r?`n" | ForEach-Object { $_ -replace '^    ', '' }) -join "`n").Trim()
          $changes = $match.Groups[1].Value.Trim() -replace "`r`n", "`n"
          if (-not $body.StartsWith('发布日期：')) { throw 'Release body must start with 发布日期' }
          if (-not $body.Contains($changes)) { throw 'Release notes differ from CHANGELOG.md' }
          if ($env:RELEASE_TAG -match '-beta' -and $body -notmatch '测试版') {
            $body += "`n`n> 测试版，请先备份重要文档；遇到问题请通过 Issues 反馈。"
          }
          Set-Content -Path release-notes.md -Value $body -Encoding utf8

      - name: Create GitHub Release and upload installer
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release.outputs.tag }}
          name: ${{ steps.release.outputs.tag }}
          body_path: release-notes.md
          draft: false
          prerelease: ${{ contains(steps.release.outputs.tag, '-') }}
          files: src-tauri/target/release/bundle/nsis/*-setup.exe
