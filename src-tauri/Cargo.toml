[package]
name = "islet"
version = "0.1.0-beta2"
description = "Islet（灵岛）- Windows 桌面灵动岛与轻量信息工具"
authors = ["Aurora"]
license = ""
repository = "https://github.com/yeyongzhi/Islet"
edition = "2024"
rust-version = "1.90"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "winisland_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.6", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.12.7", features = ["tray-icon"] }
tauri-plugin-log = "2"
arboard = "3"
base64 = "0.22"
drag = "2"
sysinfo = "0.38.4"
tauri-plugin-autostart = "2.7.0"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
    "Media_Control",
    "Win32_Media_Audio",
    "Win32_Media_Audio_Endpoints",
    "Media_Playback",
    "Foundation",
    "Storage_Streams",
    "Networking_Connectivity",
    "System_Power",
    "Win32_Foundation",
    "Win32_System_Power",
    "Win32_UI_Input_Ime",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Shell",
] }
windows-future = "0.3"
