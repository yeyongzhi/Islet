[package]
name = "winisland"
version = "0.2.0"
description = "WinIsland - a Dynamic Island style desktop widget for Windows"
authors = ["Aurora"]
license = ""
repository = ""
edition = "2024"
rust-version = "1.90"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "winisland_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.6", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.12.7", features = ["tray-icon"] }
tauri-plugin-log = "2"
arboard = "3"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
    "Media_Control",
    "Media_Playback",
    "Foundation",
    "Storage_Streams",
] }
